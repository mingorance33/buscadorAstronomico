<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador Astronómico - Catálogo Messier</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --accent: #38bdf8;
      --target: #a855f7;
      --aligned: #22c55e;
      --warning: #f59e0b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }
    header { text-align: center; margin-bottom: 0.75rem; }
    header h1 { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
    #gps-status { font-size: 0.8rem; color: var(--subtext); margin-top: 0.2rem; }

    .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 0.75rem; }
    
    .card {
      background-color: var(--card);
      border-radius: 0.75rem;
      padding: 0.85rem;
      border: 1px solid var(--border);
      text-align: center;
    }

    /* Filtros y buscador */
    .search-box { display: flex; flex-direction: column; gap: 0.5rem; }
    .filter-row { display: flex; gap: 0.4rem; }
    .filter-btn {
      flex: 1;
      padding: 0.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--card);
      color: var(--subtext);
      border: 1px solid var(--border);
      border-radius: 0.4rem;
      cursor: pointer;
    }
    .filter-btn.active {
      background: var(--target);
      color: #fff;
      border-color: var(--target);
    }

    input[type="text"], select {
      background-color: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.75rem;
      font-size: 0.95rem;
      border-radius: 0.5rem;
      width: 100%;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }

    /* Panel de guiado visual */
    .guidance-card {
      border: 1.5px solid var(--target);
      transition: border-color 0.3s, background-color 0.3s;
    }
    .guidance-card.aligned {
      border-color: var(--aligned);
      background-color: rgba(34, 197, 94, 0.1);
    }
    .guidance-arrow {
      font-size: 2.5rem;
      font-weight: bold;
      line-height: 1;
      margin: 0.3rem 0;
      color: var(--target);
      transition: color 0.3s;
    }
    .guidance-card.aligned .guidance-arrow { color: var(--aligned); }
    .guidance-text { font-size: 1.05rem; font-weight: 700; }
    .status-badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 1rem;
      margin-top: 0.3rem;
      background-color: rgba(255, 255, 255, 0.1);
    }
    .below-horizon { color: var(--warning); background-color: rgba(245, 158, 11, 0.15); }

    /* Rejilla de ángulos */
    .coords-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 0.4rem; }
    .coord-item h3 { font-size: 0.7rem; text-transform: uppercase; color: var(--subtext); }
    .dms-val { font-size: 1.25rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
    .dms-val.target-color { color: var(--target); }
    .deg-val { font-size: 0.75rem; color: var(--subtext); }

    button.primary-btn {
      background-color: var(--accent);
      color: #030712;
      font-weight: 700;
      border: none;
      padding: 0.85rem;
      font-size: 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      width: 100%;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <header>
    <h1>Buscador Astronómico</h1>
    <p id="gps-status">Catálogo Messier Completo (110 Objetos)</p>
  </header>

  <div class="container">
    <button id="start-btn" class="primary-btn">Iniciar Sensores y GPS</button>

    <div id="controls-section" class="hidden search-box">
      <!-- Filtro por categoría -->
      <div class="filter-row">
        <button class="filter-btn active" data-type="ALL">Todos (110)</button>
        <button class="filter-btn" data-type="Galaxia">Galaxias</button>
        <button class="filter-btn" data-type="Nebulosa">Nebulosas</button>
        <button class="filter-btn" data-type="Cúmulo">Cúmulos</button>
      </div>

      <!-- Buscador dinámico y selector -->
      <input type="text" id="object-search" placeholder="Escribe para buscar (ej: M31, Cangrejo, Leo)..." />
      <select id="object-select"></select>
    </div>

    <!-- Guía y flechas de apuntado -->
    <div id="guidance-panel" class="card guidance-card hidden">
      <div id="arrow-display" class="guidance-arrow">●</div>
      <div id="instruction-display" class="guidance-text">Apuntando...</div>
      <div id="visibility-badge" class="status-badge">Visible en el cielo</div>
    </div>

    <!-- Posición orbital calculada en tiempo real -->
    <div id="target-panel" class="card hidden">
      <h2 style="font-size: 0.85rem; color: var(--target);" id="target-name">Objeto Seleccionado</h2>
      <div class="coords-grid">
        <div class="coord-item">
          <h3>Azimut Teórico</h3>
          <div id="target-az-dms" class="dms-val target-color">--° --' --"</div>
          <div id="target-az-deg" class="deg-val">0.00°</div>
        </div>
        <div class="coord-item">
          <h3>Altura Teórica</h3>
          <div id="target-alt-dms" class="dms-val target-color">--° --' --"</div>
          <div id="target-alt-deg" class="deg-val">0.00°</div>
        </div>
      </div>
    </div>

    <!-- Posición real del móvil -->
    <div id="phone-panel" class="card hidden">
      <h2 style="font-size: 0.85rem; color: var(--accent);">Hacia dónde mira tu teléfono</h2>
      <div class="coords-grid">
        <div class="coord-item">
          <h3>Azimut (Brújula)</h3>
          <div id="phone-az-dms" class="dms-val">--° --' --"</div>
          <div id="phone-az-deg" class="deg-val">0.00°</div>
        </div>
        <div class="coord-item">
          <h3>Altura (Nivel)</h3>
          <div id="phone-alt-dms" class="dms-val">--° --' --"</div>
          <div id="phone-alt-deg" class="deg-val">0.00°</div>
        </div>
      </div>
    </div>
  </div>

    function populateDropdown() {
      const term = objectSearch.value.toLowerCase();
      objectSelect.innerHTML = "";

      const filtered = MESSIER_DATA.filter(obj => {
        const matchesType = (currentFilterType === "ALL" || obj.type === currentFilterType);
        const matchesQuery = obj.id.toLowerCase().includes(term) ||
                             obj.name.toLowerCase().includes(term) ||
                             obj.const.toLowerCase().includes(term);
        return matchesType && matchesQuery;
      });

      filtered.forEach(obj => {
        const opt = document.createElement('option');
        opt.value = obj.id;
        opt.textContent = `${obj.id} - ${obj.name} [${obj.const}]`;
        objectSelect.appendChild(opt);
      });

      if (filtered.length > 0) {
        updateTargetCalculation();
      }
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilterType = btn.dataset.type;
        populateDropdown();
      });
    });

    objectSearch.addEventListener('input', populateDropdown);
    objectSelect.addEventListener('change', updateTargetCalculation);

      if (deg === null || isNaN(deg)) return '--° --\' --"';
      let sign = deg < 0 ? '-' : (showSign ? '+' : '');
      let absDeg = Math.abs(deg);
      let d = Math.floor(absDeg);
      let minFloat = (absDeg - d) * 60;
      let m = Math.floor(minFloat);
      let s = Math.round((minFloat - m) * 60);
      if (s === 60) { m++; s = 0; }
      if (m === 60) { d++; m = 0; }
      const pad = (n) => String(n).padStart(2, '0');
      return `${sign}${d}° ${pad(m)}' ${pad(s)}"`;
    }

    function calculatePosition(raHours, decDeg, latDeg, lonDeg) {
      const now = new Date();
      const jd = (now.getTime() / 86400000) + 2440587.5;
      const d = jd - 2451545.0;

      let gmst = (280.46061837 + 360.98564736629 * d) % 360;
      if (gmst < 0) gmst += 360;

      let lst = (gmst + lonDeg) % 360;
      if (lst < 0) lst += 360;

      const raDeg = raHours * 15;
      let ha = (lst - raDeg) % 360;
      if (ha < 0) ha += 360;

      const toRad = Math.PI / 180;
      const toDeg = 180 / Math.PI;

      const phi = latDeg * toRad;
      const delta = decDeg * toRad;
      const H = ha * toRad;

      const sinAlt = Math.sin(phi) * Math.sin(delta) + Math.cos(phi) * Math.cos(delta) * Math.cos(H);
      const alt = Math.asin(sinAlt);

      const cosAz = (Math.sin(delta) - Math.sin(phi) * sinAlt) / (Math.cos(phi) * Math.cos(alt));
      let az = Math.acos(Math.min(1, Math.max(-1, cosAz))) * toDeg;
      if (Math.sin(H) > 0) az = 360 - az;

      return { az: az, alt: alt * toDeg };
    }

    function updateTargetCalculation() {
      if (userLat === null || userLon === null || !objectSelect.value) return;
      const target = MESSIER_DATA.find(o => o.id === objectSelect.value);
      if (!target) return;

      document.getElementById('target-name').textContent = `${target.id} — ${target.name} (${target.type})`;
      targetCoords = calculatePosition(target.ra, target.dec, userLat, userLon);

      document.getElementById('target-az-dms').textContent = toDMS(targetCoords.az);
      document.getElementById('target-az-deg').textContent = `${targetCoords.az.toFixed(2)}°`;
      document.getElementById('target-alt-dms').textContent = toDMS(targetCoords.alt, true);
      document.getElementById('target-alt-deg').textContent = `${targetCoords.alt.toFixed(2)}°`;

      if (targetCoords.alt < 0) {
        visibilityBadge.textContent = "Oculto bajo el horizonte";
        visibilityBadge.className = "status-badge below-horizon";
      } else {
        visibilityBadge.textContent = "Visible sobre el horizonte";
        visibilityBadge.className = "status-badge";
      }

      updateGuidance();
    }

    function updateGuidance() {
      if (!targetCoords) return;

      let deltaAz = (targetCoords.az - currentPhoneAz + 540) % 360 - 180;
      let deltaAlt = targetCoords.alt - currentPhoneAlt;
      const tolerance = 3.5;

      if (Math.abs(deltaAz) <= tolerance && Math.abs(deltaAlt) <= tolerance) {
        guidancePanel.classList.add('aligned');
        arrowDisplay.textContent = "🎯";
        instructionDisplay.textContent = "¡OBJETIVO CENTRADO!";
      } else {
        guidancePanel.classList.remove('aligned');
        if (Math.abs(deltaAz) > tolerance * 2) {
          if (deltaAz > 0) {
            arrowDisplay.textContent = "➔";
            instructionDisplay.textContent = `Gira a la derecha (${Math.round(deltaAz)}°)`;
          } else {
            arrowDisplay.textContent = "⬅";
            instructionDisplay.textContent = `Gira a la izquierda (${Math.round(Math.abs(deltaAz))}°)`;
          }
        } else {
          if (deltaAlt > 0) {
            arrowDisplay.textContent = "⬆";
            instructionDisplay.textContent = `Apunta más arriba (+${Math.round(deltaAlt)}°)`;
          } else {
            arrowDisplay.textContent = "⬇";
            instructionDisplay.textContent = `Apunta más abajo (${Math.round(deltaAlt)}°)`;
          }
        }
      }
    }

    function handleOrientation(event) {
      let heading = null;
      if (event.webkitCompassHeading !== undefined) {
        heading = event.webkitCompassHeading;
      } else if (event.alpha !== null) {
        heading = (360 - event.alpha) % 360;
      }

      if (heading !== null) {
        currentPhoneAz = heading;
        document.getElementById('phone-az-dms').textContent = toDMS(heading);
        document.getElementById('phone-az-deg').textContent = `${heading.toFixed(2)}°`;
      }

      if (event.beta !== null) {
        currentPhoneAlt = event.beta;
        document.getElementById('phone-alt-dms').textContent = toDMS(event.beta, true);
        document.getElementById('phone-alt-deg').textContent = `${event.beta.toFixed(2)}°`;
      }

      updateGuidance();
    }

    startBtn.addEventListener('click', async () => {
      populateDropdown();

      // GPS
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            userLat = pos.coords.latitude;
            userLon = pos.coords.longitude;
            document.getElementById('gps-status').textContent = `GPS: ${userLat.toFixed(2)}°, ${userLon.toFixed(2)}°`;
            
            controlsSection.classList.remove('hidden');
            guidancePanel.classList.remove('hidden');
            document.getElementById('target-panel').classList.remove('hidden');
            document.getElementById('phone-panel').classList.remove('hidden');

            updateTargetCalculation();
            setInterval(updateTargetCalculation, 1000);
          },
          () => { document.getElementById('gps-status').textContent = "Permiso GPS denegado"; },
          { enableHighAccuracy: true }
        );
      }

      // Sensores
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation, true);
            startBtn.classList.add('hidden');
          }
        } catch (e) { console.error(e); }
      } else {
        window.addEventListener('deviceorientationabsolute', handleOrientation, true);
        window.addEventListener('deviceorientation', handleOrientation, true);
        startBtn.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
